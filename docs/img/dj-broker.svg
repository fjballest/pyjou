<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve" style="white-space:pre"><title>Fills on a bar</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs><rect width="1000" height="320" fill="#ffffff"/><text x="20" y="26" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal">process_orders_on_close = true: an order placed on bar i fills at its close; stops and limits on the bars after</text>
<text x="160" y="60" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">bar i</text>
<text x="460" y="60" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">bar i+1</text>
<text x="760" y="60" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">bar i+2</text>
<line x1="60" y1="102" x2="980" y2="102" stroke="#2a9d5c" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="980" y="97" font-size="11" fill="#2a9d5c" text-anchor="end" font-weight="normal">limit 105</text>
<line x1="60" y1="228" x2="980" y2="228" stroke="#e0453a" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="980" y="223" font-size="11" fill="#e0453a" text-anchor="end" font-weight="normal">stop 98</text>
<line x1="160" y1="174" x2="160" y2="219.0" stroke="#089981" stroke-width="2"/>
<rect x="148" y="192" width="24" height="18" fill="#089981"/>
<line x1="460" y1="138" x2="460" y2="210" stroke="#089981" stroke-width="2"/>
<rect x="448" y="156" width="24" height="36" fill="#089981"/>
<line x1="760" y1="84" x2="760" y2="174" stroke="#089981" stroke-width="2"/>
<rect x="748" y="120" width="24" height="36" fill="#089981"/>
<text x="60" y="262" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">the script runs: entry("Long")</text>
<text x="60" y="278" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">and exit(stop 98, limit 105)</text>
<text x="60" y="294" font-size="11.5" fill="#257de0" text-anchor="start" font-weight="normal">after(): filled at the close, 100</text>
<text x="360" y="262" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">before(): open 100 → high 103</text>
<text x="360" y="278" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">→ low 99 → close (the high first:</text>
<text x="360" y="294" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">the open is nearer it); none crossed</text>
<text x="660" y="262" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">before(): the limit 105 is crossed:</text>
<text x="660" y="278" font-size="11.5" fill="#2a9d5c" text-anchor="start" font-weight="normal">out at 105, +5 points ($10 on MNQ);</text>
<text x="660" y="294" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">a gap past it fills at the open</text></svg>
