<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve" style="white-space:pre"><title>A journal on disk</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs><rect width="1000" height="430" fill="#ffffff"/><rect x="20" y="20" width="300" height="390" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.4"/>
<text x="30" y="39" font-weight="600" font-size="13.5" fill="#1f2933">DayJournal-…/ (a journal)</text>
<text x="30" y="58" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">day261117.png, day261117b.png</text>
<text x="30" y="74" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">day261117.png.txt   notes</text>
<text x="30" y="90" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">day261117.png.drw   drawings</text>
<text x="30" y="106" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">day261115weekprof.png</text>
<text x="30" y="122" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">.pyjou-tags.json    OCR cache</text>
<text x="30" y="138" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">.pyjou-weekprof.json profiles</text>
<text x="30" y="154" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">aliases.txt  news.txt</text>
<text x="30" y="170" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">MNQ-220103.m15.csv.gz</text>
<text x="30" y="186" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">MNQ-230612.m15.csv.gz …</text>
<text x="30" y="202" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">MNQ-261102.m1.csv.gz …</text>
<text x="30" y="218" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">m15draw/</text>
<text x="30" y="234" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  d261117.drw  d261117-m3.drw</text>
<text x="30" y="250" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  w261116.drw</text>
<text x="30" y="266" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  d261117.txt  (notes)</text>
<rect x="360" y="20" width="300" height="120" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.4"/>
<text x="370" y="39" font-weight="600" font-size="13.5" fill="#1f2933">an image's files</text>
<text x="370" y="58" font-size="12.5" fill="#52606d">the image: never changed</text>
<text x="370" y="74" font-size="12.5" fill="#52606d">.txt: plain UTF-8 notes</text>
<text x="370" y="90" font-size="12.5" fill="#52606d">.drw: shapes in image pixels</text>
<text x="370" y="106" font-size="12.5" fill="#52606d">all written to a temp file, then</text>
<text x="370" y="122" font-size="12.5" fill="#52606d">os.replace (no half files)</text>
<rect x="360" y="160" width="300" height="120" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.4"/>
<text x="370" y="179" font-weight="600" font-size="13.5" fill="#1f2933">candle files</text>
<text x="370" y="198" font-size="12.5" fill="#52606d">time;open;high;low;close</text>
<text x="370" y="214" font-size="12.5" fill="#52606d">(UTC seconds), gzip, at most</text>
<text x="370" y="230" font-size="12.5" fill="#52606d">MAXFILE (m15) or MAXLOW (lower)</text>
<text x="370" y="246" font-size="12.5" fill="#52606d">bytes, named by their first</text>
<text x="370" y="262" font-size="12.5" fill="#52606d">trading day; imports only add</text>
<rect x="360" y="300" width="300" height="110" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.4"/>
<text x="370" y="319" font-weight="600" font-size="13.5" fill="#1f2933">m15draw/: the data's drawings</text>
<text x="370" y="338" font-size="12.5" fill="#52606d">d&lt;YYMMDD&gt;.drw, w&lt;YYMMDD&gt;.drw</text>
<text x="370" y="354" font-size="12.5" fill="#52606d">(other time frames add -m3…);</text>
<text x="370" y="370" font-size="12.5" fill="#52606d">pixels of the chart at its own</text>
<text x="370" y="386" font-size="12.5" fill="#52606d">width W0, "width" when &lt; m15</text>
<rect x="700" y="20" width="280" height="180" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="710" y="39" font-weight="600" font-size="13.5" fill="#1f2933">settings (QSettings)</text>
<text x="710" y="58" font-size="12.5" fill="#52606d">window state, last journal,</text>
<text x="710" y="74" font-size="12.5" fill="#52606d">indicators/on, indicators/inputs/…</text>
<text x="710" y="90" font-size="12.5" fill="#52606d">indicators/folders</text>
<text x="710" y="106" font-size="12.5" fill="#52606d">datasessions, dataprofile</text>
<text x="710" y="122" font-size="12.5" fill="#52606d">tester/strategy, tf, range, files</text>
<text x="710" y="138" font-size="12.5" fill="#52606d">drawing: fib sets, saved looks</text>
<rect x="700" y="220" width="280" height="190" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="710" y="239" font-weight="600" font-size="13.5" fill="#1f2933">…/DayJournal/ (app data)</text>
<text x="710" y="258" font-size="12.5" fill="#52606d">for every journal:</text>
<text x="710" y="274" font-size="12.5" fill="#52606d">news.txt  (FETCHED)</text>
<text x="710" y="290" font-size="12.5" fill="#52606d">holidays.txt  (FETCHEDHOL)</text>
<text x="710" y="306" font-size="12.5" fill="#52606d">indicators/  ICTlevels.txt …</text>
<text x="710" y="322" font-size="12.5" fill="#52606d"></text>
<text x="710" y="338" font-size="12.5" fill="#52606d">a journal's news.txt adds or</text>
<text x="710" y="354" font-size="12.5" fill="#52606d">takes away: 2027-01-13 CPI,</text>
<text x="710" y="370" font-size="12.5" fill="#52606d">-2027-01-13 CPI</text></svg>
