<text x="30" y="74" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">o h l c float[n]</text>
<text x="30" y="90" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">wall   int64[n]  New York clock</text>
<text x="30" y="106" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">dayno  int64[n]  trading day</text>
<text x="30" y="122" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">         (18:00 → 17:00)</text>
<text x="30" y="138" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">tf, symbol, files, profs</text>
<text x="30" y="154" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">days(), weeks(), periodbars()</text>
