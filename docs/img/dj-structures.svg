<text x="350" y="39" font-weight="600" font-size="13.5" fill="#1f2933">dataview.Geom (a chart)</text>
<text x="350" y="58" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">kind "d"|"w", d, tf, bars</text>
<text x="350" y="74" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">W×H pixels, W0 its own width</text>
<text x="350" y="90" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">L R T B margins, pw ph plot</text>
<text x="350" y="106" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">top bot t0 t1   what is shown</text>
<text x="350" y="122" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">vt1 last candle, margin past it</text>
<text x="350" y="138" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">X(t) Y(p) t(x) price(y) tx(utc)</text>
<text x="350" y="154" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">mapped(): not as on W0, whole</text>
<rect x="670" y="20" width="310" height="190" rx="6" fill="#eef7ee" stroke="#2a9d5c" stroke-width="1.4"/>
<text x="680" y="39" font-weight="600" font-size="13.5" fill="#1f2933">journal.Entry · Journal</text>
<text x="680" y="58" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">Entry: name, day, week, letter,</text>
<text x="680" y="74" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  groupday, weekmonday</text>
<text x="680" y="90" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">Journal: dir, entries, aliases,</text>
<text x="680" y="106" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  news, cache {name: raw OCR}</text>
<text x="680" y="122" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">MainWindow.shown: entries of</text>
<text x="680" y="138" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  the search, in order</text>
<text x="680" y="154" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">pending {name: drawing}</text>
