name: Build and Release Executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: "v0.0.1"
        required: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install torch (Windows)
        if: runner.os == 'Windows'
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller dj.spec

      - name: list executable
        run: ls -l dist

      - name: Rename executable
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv dist/dj/dj.exe dist/dj-windows
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            mv dist/dj/dj dist/dj-linux
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            mv dist/dj/dj dist/dj-macos
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dj-${{ matrix.os }}
          path: dist/dj-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List downloaded files (Debugging)
        run: ls -R

      - name: Make files executable (Linux/Mac)
        run: chmod +x dj-* || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: true
          files: |
            dj-linux
            dj-windows
            dj-macos
