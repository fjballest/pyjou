name: Build and Release Executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: "v0.0.1"
        required: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"  # PySide6 6.10.1 needs < 3.15
      - name: Install torch (Windows)
        if: runner.os == 'Windows'
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller dj.spec

      - name: list executable
        run: ls -l dist

      - name: Package the app
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          # the whole build, not just its executable: it needs the libraries
          # next to it (_internal), and on macOS the .app around it
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd dist && 7z a -tzip -bd ../dj-$VERSION-windows.zip dj > /dev/null)
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            tar -C dist -czf dj-$VERSION-linux.tar.gz dj
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ditto -c -k --keepParent "dist/DayJournal.app" dj-$VERSION-macos.zip
          fi
          ls -l dj-$VERSION-*
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dj-${{ matrix.os }}
          path: dj-v*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List downloaded files (Debugging)
        run: ls -R

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: true
          files: dj-*
